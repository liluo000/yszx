# 各环境通用配置。本地开发配置见 application-dev.yml，线上配置见 application-prod.yml。
spring:
  application:
    name: yunshu-zhixue
  profiles:
    # 未指定环境时使用本地开发配置
    default: dev
  jackson:
    # 接口字段命名与时间格式见 docs/design/04.API接口设计.md 2.4
    property-naming-strategy: SNAKE_CASE
    time-zone: UTC
  flyway:
    # 表结构由 Flyway 管理，V1 为 scripts/sql/schema.sql 的初始基线
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 头像不超过 2MB，Excel 导入不超过 5MB
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  # 部署在 Nginx 后时，按转发头获取客户端 IP（操作日志记录 IP）
  forward-headers-strategy: native

logging:
  pattern:
    # 日志中带上请求标识，与响应中的 request_id 对应
    level: "%5p [%X{requestId:-}]"

yunshu:
  admin:
    # 初始超级管理员：仅当系统中没有任何后台账号时，启动时创建一次，首次登录必须修改密码
    init:
      account: ${ADMIN_INIT_ACCOUNT:}
      password: ${ADMIN_INIT_PASSWORD:}
      # 姓名默认取这里的中文；.env 按 properties 格式读取，不能写中文，所以本地不在 .env 中配置姓名
      name: ${ADMIN_INIT_NAME:超级管理员}
      phone: ${ADMIN_INIT_PHONE:}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 登录令牌放在请求头 Authorization: Bearer <token>（04.API接口设计.md 2.1）
# 后台账号体系的有效期等配置见 modules/iam/api/AdminStp.java；学员账号体系在开发学员登录时配置
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-cookie: false
  is-print: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
