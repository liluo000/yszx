# 线上配置：所有地址和密钥都从服务器环境变量读取，不写入代码（02.整体架构设计.md）
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

yunshu:
  storage:
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION}
    bucket: ${S3_BUCKET}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    # 公开文件的访问地址前缀（存储桶域名或 CDN 域名）
    public-base-url: ${S3_PUBLIC_BASE_URL}
    path-style: ${S3_PATH_STYLE:false}
