# 本地开发配置：连接 deploy/dev 中 Docker 启动的 MySQL 和 Redis。
# 账号密码不写在这里，而是读取 deploy/dev/.env（在项目根目录或 server 目录启动都能找到）。
spring:
  config:
    import:
      - optional:file:./deploy/dev/.env[.properties]
      - optional:file:../deploy/dev/.env[.properties]
  datasource:
    # 连接时把会话时区设为 UTC（03.数据库设计.md 第 1 章）
    url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/${MYSQL_DATABASE:yunshu_zhixue}?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USER:yunshu}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

yunshu:
  # 本地用 SeaweedFS 模拟对象存储（deploy/dev），公开文件通过匿名只读访问
  storage:
    endpoint: http://127.0.0.1:${S3_PORT:8333}
    region: us-east-1
    bucket: ${S3_BUCKET:yunshu-dev}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    public-base-url: http://127.0.0.1:${S3_PORT:8333}/${S3_BUCKET:yunshu-dev}
    path-style: true

management:
  endpoint:
    health:
      show-details: always
